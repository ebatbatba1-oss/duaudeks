<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여명단 프로필</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="newspaper-container">
        <div class="overlay-box">
            <div class="black-box">
                <input type="text" id="name-age" placeholder="이름(나이)">
            </div>

            <label class="image-upload-box" id="image-preview">
                <input type="file" id="image-input" accept="image/*">
                <span id="upload-text">+ 터치하여 이미지 넣기</span>
            </label>

            <div class="white-box">
                <textarea id="short-message" placeholder="한마디"></textarea>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
